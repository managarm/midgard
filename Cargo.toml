[workspace]
resolver = "3"
members = [
    "crates/bifrost",
    "crates/midgard",
    "crates/midgard-hv",
    "crates/midgard-protocol",
    "crates/midgard-vmm",
]
# midgard-init deliberately isn't part of the workspace because
# it gets built separately as a statically linked musl binary.
exclude = ["crates/midgard-init"]

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5.0"
async-executor = "1.14.1"
async-io = "2.6.0"
blocking = "1.7.0"
event-listener = "5"
clap = { version = "4.6.7", features = ["derive"] }
futures-lite = "2.6.1"
libc = "0.2"
piper = "0.2.5"
ruzstd = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# (Without xattr: we unpack only the files themselves.)
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "1"
toml_edit = "0.25"
# (Without gzip: what midgard downloads is compressed already.)
ureq = { version = "3", default-features = false, features = ["rustls"] }
zerocopy = { version = "0.8", features = ["derive"] }

midgard-hv = { path = "crates/midgard-hv" }
midgard-protocol = { path = "crates/midgard-protocol" }
midgard-vmm = { path = "crates/midgard-vmm" }

# Cargo needs the Managarm crates even when we're building on Linux.
hel = { git = "https://github.com/managarm/managarm" }
hel-sys = { git = "https://github.com/managarm/managarm" }
managarm = { git = "https://github.com/managarm/managarm" }
