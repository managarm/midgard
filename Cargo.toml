[workspace]
resolver = "3"
members = [
    "crates/bifrost",
    "crates/midgard",
    "crates/midgard-hv",
    "crates/midgard-protocol",
    "crates/midgard-vmm",
]
# midgard-init deliberately isn't part of the workspace because
# it gets built separately as a statically linked musl binary.
exclude = ["crates/midgard-init"]

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5.0"
async-executor = "1.14.1"
async-io = "2.6.0"
blocking = "1.7.0"
event-listener = "5"
clap = { version = "4.6.7", features = ["derive"] }
futures-lite = "2.6.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
toml = "1"
zerocopy = { version = "0.8", features = ["derive"] }

midgard-hv = { path = "crates/midgard-hv" }
midgard-protocol = { path = "crates/midgard-protocol" }
midgard-vmm = { path = "crates/midgard-vmm" }
