[package]
name = "midgard-vmm"
version = "0.1.0"
edition = "2024"
description = "midgard's virtual machine monitor: the guest's platform, its devices and their host side"
license = "MIT"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-executor.workspace = true
async-io.workspace = true
blocking.workspace = true
event-listener.workspace = true
futures-lite.workspace = true
libc.workspace = true
midgard-hv.workspace = true
midgard-protocol.workspace = true
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "socket-tcp",
    "socket-udp",
    # Datagrams of up to 64 KiB for the guest, and several in reassembly at once.
    "fragmentation-buffer-size-65536",
    "reassembly-buffer-count-4",
] }
thiserror.workspace = true
zerocopy.workspace = true
