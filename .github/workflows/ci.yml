name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, lint and test (Linux host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: rustfmt
        run: cargo fmt --all --check
      # midgard-init is not part of the workspace (see Cargo.toml).
      - name: rustfmt (midgard-init)
        working-directory: crates/midgard-init
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # midgard-init only does anything on Linux guests, where it is a static musl binary.
      - name: clippy (midgard-init, musl)
        working-directory: crates/midgard-init
        run: cargo clippy --target x86_64-unknown-linux-musl --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: test (midgard-init)
        working-directory: crates/midgard-init
        run: cargo test --locked
      - name: build midgard-init (musl)
        working-directory: crates/midgard-init
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
