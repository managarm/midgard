# The settings of the VM instances made from the Arch image: bifrost create copies this
# file into each instance, with the user that sessions run as (which user-setup creates).

[template]
description = "Arch Linux"

[guest]
init = "/sbin/init"
ready = "systemd"
user-setup = ["/etc/midgard/user-setup"]
launcher = "systemd"
display = "systemd"
